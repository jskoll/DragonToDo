name: dragontodo-backend

services:
  app:
    build:
      context: .
      dockerfile: frankenphp/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      # DATABASE_URL is deliberately NOT set here. In dev the whole backend/
      # directory is bind-mounted (see compose.override.yaml), so Symfony's own
      # .env/.env.local loading inside the container already resolves it
      # correctly — injecting it from Compose as well would just override
      # whatever a developer put in .env.local with this file's own resolution,
      # since a real container env var always wins over a .env file's value.
      # A production deployment (no bind mount, so no .env.local in the image)
      # should inject DATABASE_URL via its own environment:/env_file:/secret
      # instead of relying on this file.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  # Opt-in database services: `docker compose --profile mysql up` or
  # `docker compose --profile postgres up`. Not started by a plain `docker compose up`.
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dragontodo
      MYSQL_USER: app
      MYSQL_PASSWORD: "!ChangeMe!"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: dragontodo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "!ChangeMe!"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  postgres_data:
